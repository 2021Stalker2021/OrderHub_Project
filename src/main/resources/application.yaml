spring:
  application:
    name: OrderHub_Project

  profiles:
    active: local

  jooq:
    sql-dialect: postgres

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:orderhub}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_updates: true
        order_inserts: true
        generate_statistics: true

#  liquibase:
#    user: ${POSTGRES_USER}
#    password: ${POSTGRES_PASSWORD}
#    enabled: true
#    change-log: classpath:/db/changelog/changelog_master.yaml

server:
  port: 8081

logging:
  level:
    org.hibernate.sql: DEBUG

# ACTUATOR
management:
  info:
    env:
      enabled: true
    git:
      enabled: true
      mode: full
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
          - loggers

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

info:
  app:
    name: "OrderHub"
    version: "0.0.1"
    description: "Учимся писать продакшен код"