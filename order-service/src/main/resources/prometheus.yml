global:
  scrape_interval: 5s # период, через который будет делать запросы
  evaluation_interval: 15s # как часто будут пересчитываться правила

# конфигурация сбора метрик
scrape_configs:
  - job_name: "order-service"
    metrics_path: /actuator/prometheus

    static_configs:
      - targets: ['order-service:8081']
      - labels:
          application: 'order-service'
          environment: 'production'